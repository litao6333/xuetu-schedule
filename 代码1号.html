<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学途卫士 · 高中英语长难句云端批改看板</title>
  <style>
    :root {
      --navy-dark: #08182B;
      --navy-mid: #11294D;
      --academy-blue: #2C55A0;
      --gold: #E2C08D;
      --gold-dark: #B68B4C;
      --bg-page: #F1F5F9;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --border: #E2E8F0;
      --emerald: #059669;
      --emerald-bg: #ECFDF5;
      --crimson: #DC2626;
      --crimson-bg: #FEF2F2;
      --amber: #D97706;
      --amber-bg: #FFFBEB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
    }

    .topbar {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-mid) 100%);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 2px 12px rgba(8, 24, 43, 0.25);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--gold);
      color: var(--navy-dark);
      font-weight: 800;
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 5px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .filter-input, .filter-select {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(226, 192, 141, 0.45);
      color: #fff;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 13px;
      outline: none;
    }

    .filter-select option {
      color: #0F172A;
      background: #fff;
    }

    .filter-input::placeholder {
      color: #CBD5E1;
    }

    .btn-refresh {
      background: var(--gold);
      color: var(--navy-dark);
      border: none;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .main-layout {
      max-width: 1200px;
      margin: 18px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F8FAFC;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--navy-dark);
    }

    .count-pill {
      background: #EFF6FF;
      color: var(--academy-blue);
      font-size: 12px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 20px;
    }

    .submission-list {
      max-height: calc(100vh - 140px);
      overflow-y: auto;
    }

    .sub-item {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .sub-item:hover {
      background: #F8FAFC;
    }

    .sub-item.active {
      background: #EFF6FF;
      border-left: 4px solid var(--academy-blue);
    }

    .sub-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .sub-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--navy-dark);
    }

    .sub-code {
      font-size: 11.5px;
      font-weight: 700;
      background: var(--navy-dark);
      color: var(--gold);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .sub-meta {
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
    }

    .detail-body {
      padding: 18px;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-sub);
      font-size: 14px;
    }

    .student-banner {
      background: linear-gradient(135deg, var(--navy-dark), var(--navy-mid));
      color: #fff;
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .sb-info h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sb-info p {
      font-size: 12.5px;
      color: #CBD5E1;
    }

    .btn-gen-poster {
      background: linear-gradient(135deg, #E2C08D, #C99E5B);
      color: var(--navy-dark);
      border: none;
      border-radius: 9px;
      padding: 10px 16px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(226, 192, 141, 0.3);
    }

    .note-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
      background: #F8FAFC;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .note-bar label {
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
      color: var(--navy-dark);
    }

    .note-bar input {
      flex: 1;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .sentence-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
      background: #fff;
    }

    .sc-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .sc-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sc-num {
      background: var(--navy-dark);
      color: #fff;
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
    }

    .sc-src {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .sc-badge {
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .sc-badge.ok {
      background: var(--emerald-bg);
      color: var(--emerald);
    }

    .sc-badge.warn {
      background: var(--amber-bg);
      color: var(--amber);
    }

    .cut-box {
      background: #F8FAFC;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 14.5px;
      line-height: 1.8;
    }

    .cut-line-label {
      font-size: 11.5px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .tok-ok {
      background: #DCFCE7;
      color: #059669;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      margin: 0 3px;
    }

    .tok-wrong {
      background: #FEE2E2;
      color: #DC2626;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      margin: 0 3px;
    }

    .tok-miss {
      background: #FEF3C7;
      color: #D97706;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      margin: 0 3px;
    }

    .tok-std {
      color: #059669;
      font-weight: 900;
      margin: 0 4px;
    }

    .trans-box {
      background: #F0F5FF;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
