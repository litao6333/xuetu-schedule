<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>学途卫士 · 天津高考英语长难句意群与直译训练</title>
  <style>
    :root {
      --navy-dark: #08182B;
      --navy-mid: #11294D;
      --academy-blue: #2C55A0;
      --gold: #E2C08D;
      --gold-dark: #B68B4C;
      --bg-page: #F4F6FA;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --text-sub: #64748B;
      --border: #E2E8F0;
      --emerald: #059669;
      --emerald-bg: #ECFDF5;
      --crimson: #DC2626;
      --crimson-bg: #FEF2F2;
      --amber: #D97706;
      --amber-bg: #FFFBEB;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 30px rgba(8, 24, 43, 0.08);
    }

    .topbar {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-mid) 100%);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 12px rgba(8, 24, 43, 0.2);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-tag {
      background: var(--gold);
      color: var(--navy-dark);
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .top-actions {
      display: flex;
      gap: 6px;
    }

    .btn-teacher {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(226, 192, 141, 0.45);
      color: var(--gold);
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-teacher.grade-btn {
      background: rgba(226, 192, 141, 0.2);
      color: #FFF;
      border-color: var(--gold);
    }

    .content-area {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .welcome-banner {
      background: linear-gradient(145deg, var(--navy-dark), var(--navy-mid));
      color: #fff;
      border-radius: 14px;
      padding: 22px 18px;
      position: relative;
      overflow: hidden;
    }

    .welcome-banner::after {
      content: "";
      position: absolute;
      right: -30px;
      top: -30px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(226, 192, 141, 0.22) 0%, transparent 70%);
    }

    .welcome-sub {
      color: var(--gold);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .welcome-h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .welcome-desc {
      font-size: 13px;
      color: #CBD5E1;
      line-height: 1.6;
    }

    .form-group {
      margin-top: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--academy-blue);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--navy-dark), var(--academy-blue));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 4px 12px rgba(44, 85, 160, 0.25);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .progress-badge {
      background: #EFF6FF;
      color: var(--academy-blue);
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .timer-text {
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .progress-track {
      height: 6px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--academy-blue), var(--gold-dark));
      transition: width 0.3s ease;
    }

    .source-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--academy-blue);
      background: #EFF6FF;
      padding: 3px 8px;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    .instruction-tip {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 14px;
      background: #F8FAFC;
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 3px solid var(--gold-dark);
    }

    .sentence-arena {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      row-gap: 10px;
      padding: 14px 12px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      user-select: none;
    }

    .word-token {
      font-size: 17px;
      font-weight: 600;
      color: #0F172A;
      padding: 3px 2px;
      letter-spacing: 0.2px;
    }

    .cut-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 32px;
      padding: 0 3px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .cut-slot:hover {
      background: rgba(226, 192, 141, 0.25);
    }

    .cut-slot .slot-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #CBD5E1;
      transition: all 0.15s;
    }

    .cut-slot.active .slot-dot {
      display: none;
    }

    .cut-slot.active::after {
      content: "/";
      font-size: 20px;
      font-weight: 900;
      color: var(--gold-dark);
      background: #FEF3C7;
      border: 1.5px solid var(--gold-dark);
      border-radius: 5px;
      padding: 0 5px;
      line-height: 1.2;
    }

    .chunk-trans-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .chunk-trans-item {
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .chunk-en-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .chunk-num {
      background: var(--navy-dark);
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      flex
