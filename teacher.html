<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>学途卫士 · 教研云端阅卷与精批中心</title>
  <style>
    :root {
      --navy-dark: #08182B;
      --navy-mid: #11294D;
      --academy-blue: #2C55A0;
      --gold: #E2C08D;
      --gold-dark: #B68B4C;
      --bg-page: #F4F6FA;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --text-sub: #64748B;
      --border: #E2E8F0;
      --emerald: #059669;
      --emerald-bg: #ECFDF5;
      --crimson: #DC2626;
      --crimson-bg: #FEF2F2;
      --amber: #D97706;
      --amber-bg: #FFFBEB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
    }

    .topbar {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-mid) 100%);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 3px 14px rgba(8, 24, 43, 0.22);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-tag {
      background: var(--gold);
      color: var(--navy-dark);
      font-weight: 800;
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 5px;
      letter-spacing: 0.5px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
    }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(226, 192, 141, 0.55);
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-refresh:hover {
      background: rgba(226, 192, 141, 0.22);
    }

    .main-wrap {
      max-width: 920px;
      margin: 22px auto;
      padding: 0 16px 40px;
    }

    .filter-bar {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
    }

    .filter-input {
      flex: 1;
      min-width: 170px;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13.5px;
      outline: none;
    }

    .filter-input:focus {
      border-color: var(--academy-blue);
    }

    .count-badge {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      padding: 4px 10px;
    }

    .submission-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sub-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      transition: border-color 0.2s;
    }

    .sub-card:hover {
      border-color: #CBD5E1;
    }

    .sub-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .sub-meta-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sub-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stu-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--navy-dark);
    }

    .grade-pill {
      background: #EFF6FF;
      color: var(--academy-blue);
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
    }

    .code-pill {
      background: #FEF3C7;
      color: var(--gold-dark);
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
    }

    .sub-info-line {
      font-size: 12.5px;
      color: var(--text-sub);
    }

    .sub-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-outline {
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      color: var(--text-main);
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary-sm {
      background: linear-gradient(135deg, var(--navy-dark), var(--academy-blue));
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-danger-sm {
      background: var(--crimson-bg);
      color: var(--crimson);
      border: 1px solid #FECACA;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-danger-sm:hover {
      background: #FEE2E2;
    }

    .sub-detail-drawer {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sentence-review-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
    }

    .sr-head {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--navy-dark);
    }

    .sr-line {
      margin: 4px 0;
      line-height: 1.6;
    }

    .note-edit-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }

    .note-input {
      flex: 1;
      padding: 8px 10px;
      border: 1.5px solid #CBD5E1;
      border-radius: 8px;
      font-size: 12.5px;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 14px;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(8, 24, 43, 0.72);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      border-radius: 14px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .modal-btns {
      display: flex;
      gap: 10px;
    }

    .btn-gold {
      flex: 2;
      background: linear-gradient(135deg, #E2C08D, #C99E5B);
      color: var(--navy-dark);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand-group">
    <span class="brand-tag">学途卫士</span>
    <span class="brand-title">高中英语 · 云端自动交卷阅卷中心</span>
  </div>
  <button class="btn-refresh" onclick="fetchSubmissions()">🔄 刷新最新交卷</button>
</header>

<main class="main-wrap">
  <div class="filter-bar">
    <input type="text" id="filterName" class="filter-input" placeholder="按学员姓名筛选..." oninput="renderList()" />
    <input type="text" id="filterCode" class="filter-input" placeholder="按关卡筛选（如 长难句0001）..." oninput="renderList()" />
    <span class="count-badge" id="recordCountText">加载中...</span>
  </div>

  <div class="submission-list" id="submissionList">
    <div class="empty-state">⏳ 正在从云端加载学员交卷记录...</div>
  </div>
</main>

<div class="modal-mask" id="posterModal">
  <div class="modal-card">
    <div style="font-weight: 800; font-size: 15px; color: var(--navy-dark);">
      👨‍🏫 名师精批诊断长图（长按或点击下方按钮保存）
    </div>
    <img id="posterImg" alt="名师精批诊断报告" />
    <div class="modal-btns">
      <button class="btn-gold" onclick="downloadPoster()">📥 保存精批诊断长图</button>
      <button class="btn-outline" style="flex: 1;" onclick="closePosterModal()">关闭</button>
    </div>
  </div>
</div>

<canvas id="reportCanvas" class="hidden"></canvas>

<script>
  const SUPABASE_URL = "https://db.litao1986.ccwu.cc";
  const SUPABASE_ANON_KEY = "sb_publishable_NBhQ-TR8nlGx4A_-VeIYlw_X2IjXc5Z";

  let allRecords = [];
  let expandedIds = new Set();

  function formatChinaTime(isoStr) {
    if (!isoStr) return "";
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return isoStr;
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function fetchSubmissions() {
    const listEl = document.getElementById("submissionList");
    document.getElementById("recordCountText").textContent = "加载中...";

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/sentence_submissions?select=*&order=created_at.desc&limit=100`, {
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
        }
      });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`HTTP ${res.status}: ${txt}`);
      }
      allRecords = await res.json();
      renderList();
    } catch (err) {
      console.error(err);
      document.getElementById("recordCountText").textContent = "加载失败";
      listEl.innerHTML = `<div class="empty-state" style="color: #DC2626;">❌ 云端数据拉取失败：${err.message}<br/><br/><button class="btn-primary-sm" onclick="fetchSubmissions()">重新加载</button></div>`;
    }
  }

  async function deleteSubmission(id, studentName, codeId) {
    const ok = confirm(`确定要删除这条交卷记录吗？\n\n学员：${studentName}\n关卡：${codeId}\n\n删除后将从云端数据库永久移除，不可恢复。`);
    if (!ok) return;

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/sentence_submissions?id=eq.${id}`, {
        method: "DELETE",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Prefer": "return=minimal"
        }
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`HTTP ${res.status}: ${txt}`);
      }

      allRecords = allRecords.filter(r => r.id !== id);
      expandedIds.delete(id);
      renderList();
    } catch (err) {
      alert("删除失败，请检查网络或数据库 DELETE 权限：\n" + err.message);
    }
  }

  function toggleExpand(id) {
    if (expandedIds.has(id)) expandedIds.delete(id);
    else expandedIds.add(id);
    renderList();
  }

  function renderList() {
    const kwName = document.getElementById("filterName").value.trim().toLowerCase();
    const kwCode = document.getElementById("filterCode").value.trim().toLowerCase();
    const listEl = document.getElementById("submissionList");

    const filtered = allRecords.filter(r => {
      const nOk = !kwName || (r.student_name || "").toLowerCase().includes(kwName);
      const cOk = !kwCode || (r.code_id || "").toLowerCase().includes(kwCode);
      return nOk && cOk;
    });

    document.getElementById("recordCountText").textContent = `共 ${filtered.length} 份交卷记录`;

    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="empty-state">暂无匹配的交卷记录</div>`;
      return;
    }

    listEl.innerHTML = "";
    filtered.forEach(row => {
      const detail = row.detail || {};
      const items = detail.items || [];
      const timeLabel = detail.submittedAtLocal || formatChinaTime(row.created_at);
      const isExpanded = expandedIds.has(row.id);

      const card = document.createElement("div");
      card.className = "sub-card";

      let drawerHtml = "";
      if (isExpanded) {
        const sentencesHtml = items.map(it => {
          const st = it.stats || {};
          const stuTrans = (it.studentTrans || []).join(" / ") || "（未填写）";
          return `
            <div class="sentence-review-box">
              <div class="sr-head">
                <span>第 ${it.index} 句 · ${it.source || ""}</span>
                <span style="color: ${st.missedCount === 0 && st.wrongCount === 0 ? "#059669" : "#D97706"};">
                  切分准确率 ${st.accuracy ?? 100}%（对${st.correctCount || 0} / 漏${st.missedCount || 0} / 误${st.wrongCount || 0}）
                </span>
              </div>
              <div class="sr-line"><strong>学员切分：</strong>${it.userMarkedSentence || ""}</div>
              <div class="sr-line" style="color: #059669;"><strong>标准切分：</strong>${it.standardSentence || ""}</div>
              <div class="sr-line" style="color: #B45309;"><strong>学员直译：</strong>${stuTrans}</div>
              <div class="sr-line" style="color: #2C55A0;"><strong>标准直译：</strong>${it.literalTrans || ""}</div>
            </div>
          `;
        }).join("");

        drawerHtml = `
          <div class="sub-detail-drawer">
            ${sentencesHtml}
            <div class="note-edit-row">
              <input type="text" class="note-input" id="noteInput_${row.id}" value="红/橙标记处为意群边界薄弱点，请对照标准直译检查译文偏差并朗读三遍。" />
              <button class="btn-primary-sm" onclick="generatePosterForRecord(${row.id})">✨ 出诊断长图</button>
            </div>
          </div>
        `;
      }

      const safeName = (row.student_name || "未命名学员").replace(/'/g, "\\'");
      const safeCode = (row.code_id || "未标注关卡").replace(/'/g, "\\'");

      card.innerHTML = `
        <div class="sub-header">
          <div class="sub-meta-left">
            <div class="sub-title-row">
              <span class="stu-name">${row.student_name || "未命名学员"}</span>
              <span class="grade-pill">${row.grade || "未填年级"}</span>
              <span class="code-pill">${row.code_id || "未标注关卡"}</span>
            </div>
            <div class="sub-info-line">交卷时间：${timeLabel} &nbsp;|&nbsp; ${row.summary || ""}</div>
          </div>
          <div class="sub-actions">
            <button class="btn-outline" onclick="toggleExpand(${row.id})">${isExpanded ? "收起明细 ▲" : "展开逐句批改"}</button>
            <button class="btn-primary-sm" onclick="generatePosterForRecord(${row.id})">生成诊断长图</button>
            <button class="btn-danger-sm" onclick="deleteSubmission(${row.id}, '${safeName}', '${safeCode}')">🗑️ 删除</button>
          </div>
        </div>
        ${drawerHtml}
      `;
      listEl.appendChild(card);
    });
  }

  function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function layoutTokens(ctx, tokens, maxWidth) {
    const lines = [];
    let currentLine = [];
    let currentWidth = 0;
    const spaceW = 5;

    tokens.forEach(tok => {
      ctx.font = tok.type === "word"
        ? "600 13px -apple-system, PingFang SC, sans-serif"
        : "800 13px -apple-system, PingFang SC, sans-serif";
      const pad = tok.type === "word" ? 0 : 8;
      const w = ctx.measureText(tok.text).width + pad;

      if (currentLine.length > 0 && currentWidth + spaceW + w > maxWidth) {
        lines.push(currentLine);
        currentLine = [{ ...tok, width: w }];
        currentWidth = w;
      } else {
        if (currentLine.length > 0) currentWidth += spaceW;
        currentLine.push({ ...tok, width: w });
        currentWidth += w;
      }
    });
    if (currentLine.length > 0) lines.push(currentLine);
    return lines;
  }

  function wrapPlainText(ctx, text, maxWidth, font) {
    ctx.font = font;
    const lines = [];
    let currentLine = "";
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const testLine = currentLine + ch;
      if (ctx.measureText(testLine).width > maxWidth && currentLine.length > 0) {
        lines.push(currentLine);
        currentLine = ch;
      } else {
        currentLine = testLine;
      }
    }
    if (currentLine.length > 0) lines.push(currentLine);
    return lines;
  }

  function buildDiagnosticTokens(words, userCutSet, targetCutSet) {
    const tokens = [];
    words.forEach((word, i) => {
      tokens.push({ text: word, type: "word" });
      if (i < words.length - 1) {
        const inUser = userCutSet.has(i);
        const inTarget = targetCutSet.has(i);
        if (inUser && inTarget) tokens.push({ text: "/", type: "correct" });
        else if (inUser && !inTarget) tokens.push({ text: "✗/", type: "wrong" });
        else if (!inUser && inTarget) tokens.push({ text: "[漏]", type: "missed" });
      }
    });
    return tokens;
  }

  function buildStandardTokens(words, targetCutSet) {
    const tokens = [];
    words.forEach((word, i) => {
      tokens.push({ text: word, type: "word" });
      if (i < words.length - 1 && targetCutSet.has(i)) {
        tokens.push({ text: "/", type: "std" });
      }
    });
    return tokens;
  }

  function generatePosterForRecord(id) {
    const row = allRecords.find(r => r.id === id);
    if (!row || !row.detail) {
      alert("该记录缺少完整题目明细，无法生成长图。");
      return;
    }

    const noteInp = document.getElementById(`noteInput_${id}`);
    const customNote = (noteInp && noteInp.value.trim()) || "红/橙标记处为意群边界薄弱点，请对照标准直译检查译文偏差并朗读三遍。";

    const detail = row.detail;
    const items = detail.items || [];
    const canvas = document.getElementById("reportCanvas");
    const ctx = canvas.getContext("2d");
    const dpr = 3;
    const W = 440;
    const padX = 20;
    const cardW = W - padX * 2;
    const innerPad = 14;
    const textMaxW = cardW - innerPad * 2 - 16;

    const avgAcc = detail.avgAccuracy ?? 100;
    const timeStr = detail.durationText || "0秒";
    const rankTitle = avgAcc >= 90 ? "句法大师" : avgAcc >= 75 ? "勤思笃行" : "稳步进阶";

    const fontBody = "500 11.5px -apple-system, PingFang SC, sans-serif";
    const lineHPlain = 17;

    const itemLayouts = items.map(it => {
      const st = it.stats || {};
      const userCutSet = new Set(it.userCuts || []);
      const targetCutSet = new Set(it.targetCuts || []);
      const isPerfect = (st.missedCount || 0) === 0 && (st.wrongCount || 0) === 0;

      const stuTransText = it.studentTrans && it.studentTrans.length > 0
        ? "✍️ 学员顺句直译：" + it.studentTrans.join(" / ")
        : "✍️ 学员顺句直译：（未填写）";
      const stuTransLines = wrapPlainText(ctx, stuTransText, textMaxW, fontBody);
      const literalLines = wrapPlainText(ctx, "📖 标准顺句直译：" + (it.literalTrans || ""), textMaxW, fontBody);
      const grammarLines = wrapPlainText(ctx, "🔍 句法结构拆解：" + (it.grammarNote || ""), textMaxW, fontBody);
      const vocabStr = "💡 高频核心单字：" + (it.vocab || []).map(v => `${v.word}（${v.mean}）`).join(" · ");
      const vocabLines = wrapPlainText(ctx, vocabStr, textMaxW, fontBody);

      const knowledgeH = 12
        + stuTransLines.length * lineHPlain + 6
        + literalLines.length * lineHPlain + 6
        + grammarLines.length * lineHPlain + 6
        + vocabLines.length * lineHPlain + 8;

      const userTokens = buildDiagnosticTokens(it.words || [], userCutSet, targetCutSet);
      const userLines = layoutTokens(ctx, userTokens, textMaxW);
      const lineH = 22;

      if (isPerfect) {
        const diagBoxH = 22 + userLines.length * lineH + 4;
        const height = 46 + diagBoxH + 8 + knowledgeH + 10;
        return { it, st, isPerfect, height, userLines, stdLines: [], diagBoxH, stuTransLines, literalLines, grammarLines, vocabLines, knowledgeH };
      } else {
        const stdTokens = buildStandardTokens(it.words || [], targetCutSet);
        const stdLines = layoutTokens(ctx, stdTokens, textMaxW);
        const diagBoxH = 20 + userLines.length * lineH + 22 + stdLines.length * lineH + 6;
        const height = 46 + diagBoxH + 8 + knowledgeH + 10;
        return { it, st, isPerfect, height, userLines, stdLines, diagBoxH, stuTransLines, literalLines, grammarLines, vocabLines, knowledgeH };
      }
    });

    const noteLines = wrapPlainText(ctx, customNote, cardW - 84, "500 11px -apple-system, PingFang SC, sans-serif");
    const headerH = 175;
    const statsH = 88;
    const listHeaderH = 46;
    const itemsTotalH = itemLayouts.reduce((s, x) => s + x.height + 12, 0);
    const footerH = 65 + noteLines.length * 16;
    const H = headerH + statsH + listHeaderH + itemsTotalH + footerH;

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = "#F1F5F9";
    ctx.fillRect(0, 0, W, H);

    const grad = ctx.createLinearGradient(0, 0, W, headerH);
    grad.addColorStop(0, "#08182B");
    grad.addColorStop(1, "#11294D");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, headerH);

    drawRoundedRect(ctx, padX, 20, 74, 22, 5);
    ctx.fillStyle = "#E2C08D";
    ctx.fill();
    ctx.fillStyle = "#08182B";
    ctx.font = "800 11px -apple-system, PingFang SC, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("学途卫士", padX + 37, 31);

    ctx.fillStyle = "#CBD5E1";
    ctx.font = "600 11px -apple-system, PingFang SC, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("高中英语教研组 · 专属名师精批诊断书", padX + 84, 31);

    ctx.fillStyle = "#FFFFFF";
    ctx.font = "800 20px -apple-system, PingFang SC, sans-serif";
    ctx.fillText(detail.taskTitle || row.code_id || "长难句意群训练", padX, 66);

    ctx.fillStyle = "#94A3B8";
    ctx.font = "500 11px -apple-system, PingFang SC, sans-serif";
    ctx.fillText(`学员交卷时间：${detail.submittedAtLocal || formatChinaTime(row.created_at)}`, padX, 92);

    drawRoundedRect(ctx, padX, 112, cardW, 42, 9);
    ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
    ctx.fill();
    ctx.strokeStyle = "rgba(226, 192, 141, 0.35)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = "#FFFFFF";
    ctx.font = "700 13px -apple-system, PingFang SC, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`学员：${row.student_name}`, padX + 14, 133);

    ctx.fillStyle = "#E2C08D";
    ctx.font = "600 12px -apple-system, PingFang SC, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(row.grade || "", W - padX - 14, 133);

    const statsY = headerH + 14;
    drawRoundedRect(ctx, padX, statsY, cardW, 72, 12);
    ctx.fillStyle = "#FFFFFF";
    ctx.fill();

    const colW = cardW / 3;
    const metrics = [
      { val: `${avgAcc}%`, label: "意群切分准确率", color: "#2C55A0" },
      { val: timeStr, label: "专注思考总耗时", color: "#0F172A" },
      { val: rankTitle, label: "教研综合评级", color: "#B68B4C" }
    ];

    metrics.forEach((m, i) => {
      const cx = padX + colW * i + colW / 2;
      ctx.textAlign = "center";
      ctx.fillStyle = m.color;
      ctx.font = "800 19px -apple-system, PingFang SC, sans-serif";
      ctx.fillText(m.val, cx, statsY + 28);

      ctx.fillStyle = "#64748B";
      ctx.font = "500 11px -apple-system, PingFang SC, sans-serif";
      ctx.fillText(m.label, cx, statsY + 52);

      if (i < 2) {
        ctx.strokeStyle = "#E2E8F0";
        ctx.beginPath();
        ctx.moveTo(padX + colW * (i + 1), statsY + 16);
        ctx.lineTo(padX + colW * (i + 1), statsY + 56);
        ctx.stroke();
      }
    });

    let curY = statsY + 72 + 22;
    ctx.textAlign = "left";
    ctx.fillStyle = "#0F172A";
    ctx.font = "800 14px -apple-system, PingFang SC, sans-serif";
    ctx.fillText("逐句切分与顺句直译精批明细", padX, curY);

    ctx.textAlign = "right";
    ctx.font = "600 10px -apple-system, PingFang SC, sans-serif";
    ctx.fillStyle = "#64748B";
    ctx.fillText("🟢切对  🔴✗/误切  🟠[漏]漏切", W - padX, curY);

    curY += 16;

    itemLayouts.forEach(({ it, st, isPerfect, height, userLines, stdLines, diagBoxH, stuTransLines, literalLines, grammarLines, vocabLines, knowledgeH }) => {
      drawRoundedRect(ctx, padX, curY, cardW, height, 10);
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();
      ctx.strokeStyle = isPerfect ? "#D1FAE5" : "#FDE68A";
      ctx.lineWidth = 1;
      ctx.stroke();

      drawRoundedRect(ctx, padX + 12, curY + 12, 46, 22, 5);
      ctx.fillStyle = "#0F172A";
      ctx.fill();
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "700 11px -apple-system, PingFang SC, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`第 ${it.index} 句`, padX + 35, curY + 23);

      ctx.textAlign = "left";
      ctx.fillStyle = "#475569";
      ctx.font = "600 11px -apple-system, PingFang SC, sans-serif";
      const src = it.source || "";
      const shortSource = src.length > 13 ? src.slice(0, 13) + "..." : src;
      ctx.fillText(shortSource, padX + 64, curY + 23);

      const badgeW = isPerfect ? 104 : 138;
      const badgeX = W - padX - 12 - badgeW;
      drawRoundedRect(ctx, badgeX, curY + 12, badgeW, 22, 5);
      ctx.fillStyle = isPerfect ? "#ECFDF5" : "#FFFBEB";
      ctx.fill();
      ctx.fillStyle = isPerfect ? "#059669" : "#D97706";
      ctx.font = "700 10.5px -apple-system, PingFang SC, sans-serif";
      ctx.textAlign = "center";
      const badgeLabel = isPerfect
        ? `✓ 对${st.correctCount || 0}/漏0/误0`
        : `对${st.correctCount || 0} · 漏${st.missedCount || 0} · 误${st.wrongCount || 0}`;
      ctx.fillText(badgeLabel, badgeX + badgeW / 2, curY + 23);

      let innerY = curY + 46;
      drawRoundedRect(ctx, padX + 12, innerY, cardW - 24, diagBoxH, 8);
      ctx.fillStyle = "#F8FAFC";
      ctx.fill();

      let dy = innerY + 12;
      ctx.textAlign = "left";
      ctx.fillStyle = isPerfect ? "#059669" : "#DC2626";
      ctx.font = "700 11px -apple-system, PingFang SC, sans-serif";
      ctx.fillText(isPerfect ? "▸ 英文原句与精准意群切分：" : "▸ 学员切分现场批注：", padX + 20, dy);

      dy += 18;
      userLines.forEach(line => {
        let lx = padX + 20;
        line.forEach(tok => {
          if (tok.type === "word") {
            ctx.fillStyle = "#1E293B";
            ctx.font = "600 13px -apple-system, PingFang SC, sans-serif";
            ctx.fillText(tok.text, lx, dy);
          } else {
            drawRoundedRect(ctx, lx, dy - 9, tok.width, 17, 4);
            if (tok.type === "correct") {
              ctx.fillStyle = "#DCFCE7";
              ctx.fill();
              ctx.fillStyle = "#059669";
            } else if (tok.type === "wrong") {
              ctx.fillStyle = "#FEE2E2";
              ctx.fill();
              ctx.fillStyle = "#DC2626";
            } else {
              ctx.fillStyle = "#FEF3C7";
              ctx.fill();
              ctx.fillStyle = "#D97706";
            }
            ctx.font = "800 11px -apple-system, PingFang SC, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(tok.text, lx + tok.width / 2, dy);
            ctx.textAlign = "left";
          }
          lx += tok.width + 5;
        });
        dy += 22;
      });

      if (!isPerfect) {
        dy += 4;
        ctx.fillStyle = "#059669";
        ctx.font = "700 11px -apple-system, PingFang SC, sans-serif";
        ctx.fillText("▸ 教研标准意群：", padX + 20, dy);

        dy += 18;
        stdLines.forEach(line => {
          let lx = padX + 20;
          line.forEach(tok => {
            if (tok.type === "word") {
              ctx.fillStyle = "#475569";
              ctx.font = "500 12.5px -apple-system, PingFang SC, sans-serif";
              ctx.fillText(tok.text, lx, dy);
            } else {
              ctx.fillStyle = "#059669";
              ctx.font = "800 13px -apple-system, PingFang SC, sans-serif";
              ctx.fillText("/", lx + 2, dy);
            }
            lx += tok.width + 5;
          });
          dy += 22;
        });
      }

      innerY += diagBoxH + 8;
      drawRoundedRect(ctx, padX + 12, innerY, cardW - 24, knowledgeH, 8);
      ctx.fillStyle = "#F0F5FF";
      ctx.fill();

      let ky = innerY + 13;
      ctx.textAlign = "left";
      ctx.font = fontBody;

      ctx.fillStyle = "#B45309";
      stuTransLines.forEach(line => { ctx.fillText(line, padX + 20, ky); ky += lineHPlain; });

      ky += 5;
      ctx.fillStyle = "#059669";
      literalLines.forEach(line => { ctx.fillText(line, padX + 20, ky); ky += lineHPlain; });

      ky += 5;
      ctx.fillStyle = "#334155";
      grammarLines.forEach(line => { ctx.fillText(line, padX + 20, ky); ky += lineHPlain; });

      ky += 5;
      ctx.fillStyle = "#2C55A0";
      vocabLines.forEach(line => { ctx.fillText(line, padX + 20, ky); ky += lineHPlain; });

      curY += height + 12;
    });

    curY += 4;
    drawRoundedRect(ctx, padX, curY, 64, 22, 5);
    ctx.fillStyle = "#0F172A";
    ctx.fill();
    ctx.fillStyle = "#E2C08D";
    ctx.font = "700 11px -apple-system, PingFang SC, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("名师寄语", padX + 32, curY + 11);

    ctx.textAlign = "left";
    ctx.fillStyle = "#334155";
    ctx.font = "500 11px -apple-system, PingFang SC, sans-serif";
    let ny = curY + 11;
    noteLines.forEach(line => { ctx.fillText(line, padX + 72, ny); ny += 16; });

    ctx.textAlign = "center";
    ctx.fillStyle = "#94A3B8";
    ctx.font = "500 10.5px -apple-system, PingFang SC, sans-serif";
    ctx.fillText("学途卫士高中英语教研组 · 精细化课后诊断反馈", W / 2, ny + 22);

    const imgEl = document.getElementById("posterImg");
    imgEl.dataset.student = row.student_name || "学员";
    imgEl.src = canvas.toDataURL("image/png");
    document.getElementById("posterModal").classList.add("show");
  }

  function closePosterModal() {
    document.getElementById("posterModal").classList.remove("show");
  }

  function downloadPoster() {
    const img = document.getElementById("posterImg");
    const sName = img.dataset.student || "学员";
    const link = document.createElement("a");
    link.download = `学途卫士_名师精批诊断_${sName}.png`;
    link.href = img.src;
    link.click();
  }

  fetchSubmissions();
</script>
</body>
</html>
